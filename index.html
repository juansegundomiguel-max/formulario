<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduApp - Registro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            padding: 30px;
        }

        h1, h2 {
            text-align: center;
        }

        section {
            background: white;
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        textarea {
            resize: vertical;
        }

        fieldset {
            border-radius: 10px;
            margin-top: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>

</head>


<body>

<h1>EduApp 📚</h1>
<p style="text-align:center;">Aprendé, organizate y mejorá tus conocimientos.</p>


<section>

<h2>Crear cuenta</h2>


<form action="https://formspree.io/f/mojgekzo" method="POST">


<fieldset>

<legend>Información personal</legend>


<label for="nombre">Nombre completo</label>
<input 
id="nombre"
name="nombre"
type="text"
placeholder="Juan Pérez"
autocomplete="name"
required>


<label for="email">Correo electrónico</label>
<input
id="email"
name="email"
type="email"
placeholder="ejemplo@gmail.com"
autocomplete="email"
required>


<label for="password">Contraseña</label>
<input
id="password"
name="password"
type="password"
placeholder="Mínimo 8 caracteres"
autocomplete="new-password"
minlength="8"
required>


<label for="edad">Edad</label>
<input
id="edad"
name="edad"
type="number"
min="13"
max="100"
required>


<label for="fecha">Fecha de nacimiento</label>
<input
id="fecha"
name="fecha"
type="date"
required>


</fieldset>



<fieldset>

<legend>Perfil</legend>


<label for="usuario">Nombre de usuario</label>
<input
id="usuario"
name="usuario"
type="text"
placeholder="Usuario123"
pattern="[A-Za-z0-9]{5,12}"
title="Debe tener entre 5 y 12 caracteres alfanuméricos"
required>


<label for="pais">País</label>
<select id="pais" name="pais" required>

<option value="">Seleccionar país</option>
<option>Argentina</option>
<option>Chile</option>
<option>Uruguay</option>
<option>Brasil</option>

</select>



<label for="ciudad">Ciudad de residencia</label>

<input 
list="ciudades"
id="ciudad"
name="ciudad"
placeholder="Escribí tu ciudad"
required>


<datalist id="ciudades">

<option value="Buenos Aires">
<option value="Córdoba">
<option value="Rosario">
<option value="Mendoza">
<option value="La Plata">

</datalist>



<p>Género:</p>

<input 
type="radio"
id="masculino"
name="genero"
value="Masculino">

<label for="masculino">Masculino</label>


<input 
type="radio"
id="femenino"
name="genero"
value="Femenino">

<label for="femenino">Femenino</label>


<input 
type="radio"
id="otro"
name="genero"
value="Otro">

<label for="otro">Otro</label>



<p>Intereses:</p>


<input 
type="checkbox"
id="programacion"
name="intereses"
value="Programación">

<label for="programacion">Programación</label>


<input 
type="checkbox"
id="idiomas"
name="intereses"
value="Idiomas">

<label for="idiomas">Idiomas</label>


<input 
type="checkbox"
id="ciencia"
name="intereses"
value="Ciencia">

<label for="ciencia">Ciencia</label>



<label for="bio">Biografía corta</label>

<textarea
id="bio"
name="biografia"
maxlength="200"
placeholder="Contanos algo sobre vos..."
aria-label="Biografía del usuario"></textarea>


</fieldset>



<button type="submit">
Crear cuenta
</button>


</form>

</section>





<section>

<h2>Contacto y soporte</h2>


<form action="https://formspree.io/f/TU_ENDPOINT" method="POST">


<label for="nombreContacto">
Nombre
</label>

<input
id="nombreContacto"
name="nombre"
type="text"
autocomplete="name"
required>



<label for="emailContacto">
Email
</label>

<input
id="emailContacto"
name="email"
type="email"
autocomplete="email"
required>



<label for="motivo">
Motivo de contacto
</label>


<select 
id="motivo"
name="motivo"
required>

<option value="">
Seleccionar
</option>

<option>
Problema técnico
</option>

<option>
Cuenta
</option>

<option>
Sugerencia
</option>

<option>
Otro
</option>

</select>



<label for="mensaje">
Mensaje
</label>

<textarea
id="mensaje"
name="mensaje"
placeholder="Escribí tu consulta..."
required></textarea>



<input
id="terminos"
name="terminos"
type="checkbox"
required>


<label for="terminos">
Acepto los términos y condiciones
</label>



<button type="submit">
Enviar mensaje
</button>


</form>


</section>


</body>

</html>
